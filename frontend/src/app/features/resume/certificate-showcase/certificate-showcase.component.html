<section class="certs-wall" *ngIf="certificates.length" aria-labelledby="certs-wall-heading">
    <header class="certs-wall__header">
        <h2 id="certs-wall-heading">Certificaciones y cursos</h2>
        <p class="certs-wall__sub">
            Credenciales con enlace de verificación público. Cada tarjeta lleva directamente al certificado original.
        </p>
    </header>

    <div class="certs-wall__grid" role="list">
        <article
            class="cert-card"
            *ngFor="let cert of certificates; trackBy: trackByCertificate"
            role="listitem">

            <div class="cert-card__accent" aria-hidden="true"></div>

            <div class="cert-card__icon" aria-hidden="true">
                <i class="fas fa-award"></i>
            </div>

            <div class="cert-card__body">
                <p class="cert-card__issuer">{{ cert.issuer }}</p>
                <h3 class="cert-card__title">{{ cert.title }}</h3>
                <time class="cert-card__date" [attr.datetime]="cert.issuedOn">
                    {{ cert.issuedOn | date: 'MMMM y' }}
                </time>
                <p class="cert-card__topics" *ngIf="cert.topics">{{ cert.topics }}</p>
            </div>

            <a
                class="cert-card__verify"
                [href]="cert.verificationUrl"
                target="_blank"
                rel="noopener noreferrer"
                [attr.aria-label]="'Verificar credencial: ' + cert.title">
                <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                <span>Verificar</span>
            </a>
        </article>
    </div>
</section>
