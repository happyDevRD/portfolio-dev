<div class="projects-page">
<section class="projects-section">

  <!-- Header -->
  <div class="section-header">
    <p class="section-eyebrow">Portfolio</p>
    <h1>Proyectos<span class="count-chip" *ngIf="!isLoading && !loadError">{{ resultCount$ | async }}</span></h1>
    <p class="section-subtitle">Casos reales con reto, solución y stack. Métricas de producción donde aplica.</p>
  </div>

  <div class="api-error-banner" *ngIf="loadError" role="alert">
    <i class="fas fa-plug" aria-hidden="true"></i>
    <span>No se pudieron cargar los proyectos. Revisa la conexión.</span>
  </div>

  <!-- Filtros -->
  <div class="filters" *ngIf="!isLoading && !loadError" role="group" aria-label="Filtrar por categoría">
    <button *ngFor="let tab of (availableTabs$ | async)"
        class="filter-btn"
        [class.active]="(filter$ | async) === tab.label"
        [attr.aria-pressed]="(filter$ | async) === tab.label"
        (click)="setFilter(tab.label)">
      <i [class]="tab.icon" aria-hidden="true"></i>
      {{ tab.label }}
    </button>
  </div>

  <!-- Grid -->
  <div class="projects-viewport">

    <!-- Skeleton -->
    <div class="projects-grid" *ngIf="isLoading">
        <app-project-card-skeleton class="featured-slot" *ngFor="let i of [1]"></app-project-card-skeleton>
        <app-project-card-skeleton *ngFor="let i of [2,3,4,5]"></app-project-card-skeleton>
    </div>

    <!-- Proyectos -->
    <div class="projects-grid" *ngIf="!isLoading && !loadError">
        <app-project-card
            *ngFor="let project of (paginatedProjects$ | async); let i = index"
            [project]="project"
            [featured]="i === 0"
            [class.featured-slot]="i === 0"
            class="animate-slide-up"
            [style.animation-delay]="(i * 80) + 'ms'">
        </app-project-card>
    </div>
  </div>

  <!-- Paginación (solo si hay más de una página) -->
  <div class="pagination-controls" *ngIf="!isLoading && !loadError && (totalPages$ | async)! > 1">
      <button class="page-btn" (click)="prevPage()" [disabled]="(currentPage$ | async) === 1">
          <i class="fas fa-chevron-left" aria-hidden="true"></i> Anterior
      </button>
      <span class="page-info">{{ currentPage$ | async }} / {{ totalPages$ | async }}</span>
      <button class="page-btn" (click)="nextPage()" [disabled]="(currentPage$ | async) === (totalPages$ | async)">
          Siguiente <i class="fas fa-chevron-right" aria-hidden="true"></i>
      </button>
  </div>

  <div *ngIf="!isLoading && !loadError && (filteredProjects$ | async)?.length === 0" class="no-results">
      <i class="fas fa-search" aria-hidden="true"></i>
      No hay proyectos en esta categoría.
  </div>

</section>
</div>
