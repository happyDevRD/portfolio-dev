<article class="project-card" [class.project-card--featured]="featured">

    <!-- Imagen -->
    <a [routerLink]="['/projects', project.id]"
       class="card-image"
       [attr.aria-label]="'Ver caso: ' + project.title"
       tabindex="-1">
        <img
            *ngIf="project.imageUrl"
            [src]="project.imageUrl"
            [alt]="project.title"
            width="800"
            height="450"
            loading="lazy"
            decoding="async">
        <span class="tech-badge" *ngIf="project.tags?.length">{{ project.tags![0] }}</span>
        <span class="live-badge" *ngIf="project.projectUrl">
            <i class="fas fa-circle" aria-hidden="true"></i> Live
        </span>
        <span class="private-badge" *ngIf="!project.projectUrl && !project.githubUrl">
            <i class="fas fa-lock" aria-hidden="true"></i> Privado
        </span>
    </a>

    <!-- Contenido -->
    <div class="card-content">

        <a [routerLink]="['/projects', project.id]" class="card-title-link">
            <h3>{{ project.title }}</h3>
        </a>

        <p class="card-desc">{{ project.description }}</p>

        <!-- Featured: lista completa de resultados -->
        <ul class="card-features" *ngIf="featured && project.features?.length">
            <li *ngFor="let f of project.features">
                <i class="fas fa-check-circle" aria-hidden="true"></i>
                <span>{{ f }}</span>
            </li>
        </ul>

        <!-- Normal: primer logro destacado -->
        <p class="card-highlight" *ngIf="!featured && project.features?.length">
            <i class="fas fa-check-circle" aria-hidden="true"></i>
            {{ project.features![0] }}
        </p>

        <div class="tags" *ngIf="project.tags?.length">
            <span class="tag" *ngFor="let tag of project.tags!.slice(0, featured ? 8 : 4)">{{ tag }}</span>
        </div>

        <div class="card-actions">
            <a [routerLink]="['/projects', project.id]" class="btn-detail">
                Ver caso <i class="fas fa-arrow-right" aria-hidden="true"></i>
            </a>
            <div class="card-ext-links">
                <a *ngIf="project.projectUrl"
                   [href]="project.projectUrl"
                   target="_blank" rel="noopener"
                   class="btn-icon"
                   title="Ver en vivo"
                   aria-label="Ver proyecto en vivo">
                    <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                </a>
                <a *ngIf="project.githubUrl"
                   [href]="project.githubUrl"
                   target="_blank" rel="noopener"
                   class="btn-icon"
                   title="Ver código en GitHub"
                   aria-label="Ver código en GitHub">
                    <i class="fab fa-github" aria-hidden="true"></i>
                </a>
                <span *ngIf="!project.projectUrl && !project.githubUrl" class="private-hint">
                    <i class="fas fa-lock" aria-hidden="true"></i> NDA
                </span>
            </div>
        </div>
    </div>

</article>
